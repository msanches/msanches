
name: Generate Arcade Contribution Graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate arcade games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: msanches
          games: 'pacman,galaga,breakout,bomberman,minesweeper,puzzle-bobble'
          hide_month_labels: 'false'

      - name: Publish SVG animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
